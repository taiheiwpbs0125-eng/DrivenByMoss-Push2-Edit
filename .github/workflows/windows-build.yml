name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package
      - shell: pwsh
        run: Copy-Item target/DrivenByMoss-26.4.0.jar target/DrivenByMoss-Push2-Edit.bwextension
      - uses: actions/upload-artifact@v4
        with:
          name: DrivenByMoss-Push2-Edit
          path: target/DrivenByMoss-Push2-Edit.bwextension
          if-no-files-found: error
